<svg xmlns="http://www.w3.org/2000/svg" width="360" height="720" viewBox="0 0 360 720" font-family="Helvetica, Arial, sans-serif">
  <rect width="360" height="720" fill="#fdf6f0"/>
  <rect x="1" y="1" width="358" height="718" rx="28" fill="none" stroke="#333" stroke-width="3"/>

  <!-- status bar -->
  <rect x="1" y="1" width="358" height="28" rx="0" fill="#fdf6f0"/>
  <text x="20" y="20" font-size="12" fill="#333">9:41</text>
  <text x="300" y="20" font-size="12" fill="#333">100%</text>

  <!-- title -->
  <text x="180" y="90" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">Pomodoro Timer</text>

  <!-- phase label -->
  <text x="180" y="180" font-size="24" font-weight="bold" fill="#D64545" text-anchor="middle">Focus</text>

  <!-- countdown ring -->
  <circle cx="180" cy="300" r="100" fill="none" stroke="#eee" stroke-width="10"/>
  <circle cx="180" cy="300" r="100" fill="none" stroke="#D64545" stroke-width="10"
          stroke-dasharray="471" stroke-dashoffset="140" stroke-linecap="round"
          transform="rotate(-90 180 300)"/>
  <text x="180" y="312" font-size="46" font-weight="bold" fill="#333" text-anchor="middle">18:24</text>

  <!-- sessions completed -->
  <text x="180" y="425" font-size="14" fill="#555" text-anchor="middle">Completed focus sessions: 2</text>

  <!-- preset chips -->
  <rect x="24" y="460" width="130" height="36" rx="18" fill="#D64545"/>
  <text x="89" y="483" font-size="13" fill="#fff" text-anchor="middle">Classic Pomodoro</text>

  <rect x="164" y="460" width="90" height="36" rx="18" fill="none" stroke="#999" stroke-width="1.5"/>
  <text x="209" y="483" font-size="13" fill="#555" text-anchor="middle">Short Focus</text>

  <rect x="264" y="460" width="90" height="36" rx="18" fill="none" stroke="#999" stroke-width="1.5"/>
  <text x="309" y="483" font-size="13" fill="#555" text-anchor="middle">Deep Work</text>

  <!-- buttons -->
  <rect x="70" y="540" width="100" height="48" rx="24" fill="#D64545"/>
  <text x="120" y="570" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Pause</text>

  <rect x="190" y="540" width="100" height="48" rx="24" fill="none" stroke="#333" stroke-width="2"/>
  <text x="240" y="570" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">Reset</text>

  <!-- hand-drawn annotation -->
  <text x="180" y="660" font-size="12" fill="#888" text-anchor="middle" font-style="italic">UI mockup — hand-drawn, not a rendered screenshot</text>
</svg>
