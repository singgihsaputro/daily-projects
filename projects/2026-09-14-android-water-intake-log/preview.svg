<svg xmlns="http://www.w3.org/2000/svg" width="360" height="720" viewBox="0 0 360 720" font-family="Helvetica, Arial, sans-serif">
  <rect width="360" height="720" fill="#f0f8fc"/>
  <rect x="1" y="1" width="358" height="718" rx="28" fill="none" stroke="#333" stroke-width="3"/>

  <!-- status bar -->
  <rect x="1" y="1" width="358" height="28" rx="0" fill="#f0f8fc"/>
  <text x="20" y="20" font-size="12" fill="#333">9:41</text>
  <text x="300" y="20" font-size="12" fill="#333">100%</text>

  <!-- title -->
  <text x="24" y="80" font-size="22" font-weight="bold" fill="#333">Water Intake</text>

  <!-- total / goal -->
  <text x="24" y="115" font-size="18" fill="#1E88E5">950 / 2000 ml</text>

  <!-- progress bar -->
  <rect x="24" y="130" width="312" height="12" rx="6" fill="#dcecf6"/>
  <rect x="24" y="130" width="150" height="12" rx="6" fill="#1E88E5"/>

  <!-- add a drink -->
  <text x="24" y="175" font-size="15" font-weight="bold" fill="#333">Add a drink</text>

  <rect x="24" y="190" width="90" height="36" rx="18" fill="none" stroke="#1E88E5" stroke-width="1.5"/>
  <text x="69" y="213" font-size="12" fill="#1E88E5" text-anchor="middle">Cup · 200 ml</text>

  <rect x="122" y="190" width="98" height="36" rx="18" fill="none" stroke="#1E88E5" stroke-width="1.5"/>
  <text x="171" y="213" font-size="12" fill="#1E88E5" text-anchor="middle">Glass · 250 ml</text>

  <rect x="228" y="190" width="108" height="36" rx="18" fill="none" stroke="#1E88E5" stroke-width="1.5"/>
  <text x="282" y="213" font-size="12" fill="#1E88E5" text-anchor="middle">Bottle · 500 ml</text>

  <!-- today's log -->
  <text x="24" y="270" font-size="15" font-weight="bold" fill="#333">Today's log</text>

  <line x1="24" y1="285" x2="336" y2="285" stroke="#ddd" stroke-width="1"/>
  <text x="24" y="312" font-size="14" fill="#333">Glass · 250 ml</text>
  <text x="24" y="330" font-size="11" fill="#777">07:15</text>
  <text x="320" y="316" font-size="16" fill="#999" text-anchor="middle">✕</text>

  <line x1="24" y1="345" x2="336" y2="345" stroke="#ddd" stroke-width="1"/>
  <text x="24" y="372" font-size="14" fill="#333">Bottle · 500 ml</text>
  <text x="24" y="390" font-size="11" fill="#777">09:40</text>
  <text x="320" y="376" font-size="16" fill="#999" text-anchor="middle">✕</text>

  <line x1="24" y1="405" x2="336" y2="405" stroke="#ddd" stroke-width="1"/>
  <text x="24" y="432" font-size="14" fill="#333">Cup · 200 ml</text>
  <text x="24" y="450" font-size="11" fill="#777">11:05</text>
  <text x="320" y="436" font-size="16" fill="#999" text-anchor="middle">✕</text>

  <line x1="24" y1="465" x2="336" y2="465" stroke="#ddd" stroke-width="1"/>

  <!-- hand-drawn annotation -->
  <text x="180" y="660" font-size="12" fill="#888" text-anchor="middle" font-style="italic">UI mockup — hand-drawn, not a rendered screenshot</text>
</svg>
