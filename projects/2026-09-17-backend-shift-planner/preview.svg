<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
  <rect width="900" height="560" fill="#1e1e2e"/>
  <rect x="0" y="0" width="900" height="34" fill="#313244"/>
  <circle cx="20" cy="17" r="6" fill="#f38ba8"/>
  <circle cx="42" cy="17" r="6" fill="#f9e2af"/>
  <circle cx="64" cy="17" r="6" fill="#a6e3a1"/>
  <text x="450" y="22" fill="#cdd6f4" font-family="monospace" font-size="13" text-anchor="middle">shift-planner — terminal</text>

  <g font-family="monospace" font-size="13" fill="#cdd6f4">
    <text x="16" y="60"><tspan fill="#a6e3a1">$</tspan> npm start &amp;</text>
    <text x="16" y="80" fill="#9399b2">shift-planner listening on :8080</text>

    <text x="16" y="112"><tspan fill="#a6e3a1">$</tspan> curl -s localhost:8080/api/shifts?date=2026-09-18</text>
    <text x="16" y="132" fill="#89b4fa">[{"id":"sh2","start":"11:00","end":"16:00","role":"barista","employeeId":null},</text>
    <text x="16" y="150" fill="#89b4fa"> {"id":"sh4","start":"14:00","end":"20:00","role":"cook","employeeId":null}, ...]</text>

    <text x="16" y="182"><tspan fill="#a6e3a1">$</tspan> curl -s -X POST .../shifts/sh2/assign -d '{"employeeId":"emp2"}'</text>
    <text x="16" y="202" fill="#89b4fa">{"id":"sh2","start":"11:00","end":"16:00","role":"barista","employeeId":"emp2"}</text>

    <text x="16" y="234"><tspan fill="#a6e3a1">$</tspan> curl -s -X POST .../shifts/sh4/assign -d '{"employeeId":"emp1"}'</text>
    <text x="16" y="254" fill="#f38ba8">HTTP 409 {"error":"Ada Osei is a barista, but shift \"sh4\" needs a cook"}</text>

    <text x="16" y="286"><tspan fill="#a6e3a1">$</tspan> curl -s -X POST .../shifts/sh1/assign -d '{"employeeId":"emp2"}'</text>
    <text x="16" y="306" fill="#f38ba8">HTTP 409 {"error":"Ben Kato already has shift \"sh2\" (11:00-16:00) on 2026-09-18"}</text>

    <text x="16" y="338"><tspan fill="#a6e3a1">$</tspan> curl -s localhost:8080/api/employees/emp2/schedule</text>
    <text x="16" y="358" fill="#89b4fa">{"employee":{"id":"emp2","name":"Ben Kato","role":"barista"},</text>
    <text x="16" y="376" fill="#89b4fa"> "shifts":[{"id":"sh2","start":"11:00","end":"16:00","employeeId":"emp2"}]}</text>

    <text x="16" y="408"><tspan fill="#a6e3a1">$</tspan> curl -s -X DELETE localhost:8080/api/shifts/sh2/assign</text>
    <text x="16" y="428" fill="#89b4fa">{"id":"sh2","start":"11:00","end":"16:00","role":"barista","employeeId":null}</text>

    <text x="16" y="460"><tspan fill="#a6e3a1">$</tspan> curl -s -X POST localhost:8080/api/shifts/nope/assign -d '{"employeeId":"emp1"}'</text>
    <text x="16" y="480" fill="#f38ba8">HTTP 404 {"error":"shift \"nope\" not found"}</text>
  </g>
</svg>
