<svg xmlns="http://www.w3.org/2000/svg" width="360" height="720" viewBox="0 0 360 720">
  <rect width="360" height="720" fill="#FFFBFE"/>

  <!-- status bar -->
  <rect width="360" height="28" fill="#FFFBFE"/>
  <text x="20" y="19" font-family="monospace" font-size="12" fill="#1C1B1F">9:41</text>

  <!-- title -->
  <text x="24" y="70" font-family="sans-serif" font-size="22" font-weight="bold" fill="#1C1B1F">Password Generator</text>

  <!-- generated password -->
  <text x="24" y="118" font-family="monospace" font-size="19" fill="#1C1B1F">Tr4v#Blaze9!Kite</text>
  <text x="24" y="140" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2E7D32">Strong</text>

  <!-- buttons -->
  <rect x="24" y="156" width="110" height="40" rx="20" fill="#6750A4"/>
  <text x="79" y="181" font-family="sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">Generate</text>

  <rect x="146" y="156" width="90" height="40" rx="20" fill="none" stroke="#6750A4" stroke-width="1.5"/>
  <text x="191" y="181" font-family="sans-serif" font-size="14" fill="#6750A4" text-anchor="middle">Copy</text>

  <!-- length slider -->
  <text x="24" y="236" font-family="sans-serif" font-size="16" fill="#1C1B1F">Length: 16</text>
  <line x1="24" y1="258" x2="336" y2="258" stroke="#CAC4D0" stroke-width="4" stroke-linecap="round"/>
  <line x1="24" y1="258" x2="185" y2="258" stroke="#6750A4" stroke-width="4" stroke-linecap="round"/>
  <circle cx="185" cy="258" r="9" fill="#6750A4"/>

  <!-- option rows -->
  <g font-family="sans-serif" font-size="15" fill="#1C1B1F">
    <text x="24" y="300">Uppercase (A-Z)</text>
    <rect x="310" y="287" width="20" height="20" rx="4" fill="#6750A4"/>

    <text x="24" y="334">Lowercase (a-z)</text>
    <rect x="310" y="321" width="20" height="20" rx="4" fill="#6750A4"/>

    <text x="24" y="368">Numbers (0-9)</text>
    <rect x="310" y="355" width="20" height="20" rx="4" fill="#6750A4"/>

    <text x="24" y="402">Symbols (!@#$)</text>
    <rect x="310" y="389" width="20" height="20" rx="4" fill="#6750A4"/>
  </g>

  <line x1="24" y1="424" x2="336" y2="424" stroke="#E7E0EC" stroke-width="1"/>

  <!-- history -->
  <text x="24" y="458" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1C1B1F">History</text>

  <g font-family="monospace" font-size="14" fill="#1C1B1F">
    <text x="24" y="490">Tr4v#Blaze9!Kite</text>
    <text x="24" y="508" font-family="sans-serif" font-size="12" fill="#49454F">Strong · 16 chars · 08:12</text>
    <line x1="24" y1="522" x2="336" y2="522" stroke="#E7E0EC" stroke-width="1"/>

    <text x="24" y="546">quiet7moon</text>
    <text x="24" y="564" font-family="sans-serif" font-size="12" fill="#49454F">Weak · 10 chars · 07:40</text>
    <line x1="24" y1="578" x2="336" y2="578" stroke="#E7E0EC" stroke-width="1"/>

    <text x="24" y="602">Zn8@Comet$Falcon2</text>
    <text x="24" y="620" font-family="sans-serif" font-size="12" fill="#49454F">Strong · 17 chars · Yesterday</text>
  </g>

  <text x="180" y="700" font-family="sans-serif" font-size="11" fill="#79747E" text-anchor="middle">UI mockup — hand-drawn, not a screenshot</text>
</svg>
