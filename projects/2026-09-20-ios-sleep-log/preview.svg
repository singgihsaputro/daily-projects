<svg xmlns="http://www.w3.org/2000/svg" width="390" height="720" viewBox="0 0 390 720" font-family="Helvetica, Arial, sans-serif">
  <!-- UI mockup, hand-drawn, not a screenshot -->
  <rect width="390" height="720" rx="36" fill="#f2f2f7"/>
  <rect x="4" y="4" width="382" height="712" rx="32" fill="none" stroke="#1c1c1e" stroke-width="3"/>

  <!-- status bar -->
  <text x="34" y="34" font-size="14" font-weight="600" fill="#1c1c1e">9:41</text>
  <rect x="330" y="22" width="26" height="12" rx="2" fill="none" stroke="#1c1c1e" stroke-width="1.5"/>
  <rect x="333" y="24.5" width="18" height="7" fill="#1c1c1e"/>

  <!-- nav title + add button -->
  <text x="34" y="82" font-size="26" font-weight="700" fill="#1c1c1e">Sleep Log</text>
  <circle cx="352" cy="72" r="18" fill="#007aff"/>
  <path d="M352 64 v16 M344 72 h16" stroke="white" stroke-width="2.4" stroke-linecap="round"/>

  <!-- average card -->
  <text x="30" y="120" font-size="22" font-weight="700" fill="#1c1c1e">7.0h average</text>
  <text x="30" y="140" font-size="12" fill="#6e6e73">Last 7 nights</text>
  <line x1="30" y1="156" x2="360" y2="156" stroke="#d1d1d6" stroke-width="1"/>

  <!-- section header -->
  <text x="30" y="178" font-size="13" font-weight="700" fill="#6e6e73">NIGHTLY LOG</text>

  <!-- rows: date/quality | bar | hours -->
  <g font-size="13" fill="#1c1c1e">
    <!-- Mon, Sep 14 - fair - 6.5h -->
    <text x="30" y="202">Mon, Sep 14</text>
    <text x="30" y="217" font-size="11" fill="#ff9500">☁ Fair</text>
    <rect x="160" y="198" width="180" height="16" rx="4" fill="#e5e5ea"/>
    <rect x="160" y="198" width="138" height="16" rx="4" fill="#ff9500"/>
    <text x="348" y="210" font-size="12" text-anchor="end">6.5h</text>

    <!-- Tue, Sep 15 - good - 7.5h -->
    <text x="30" y="242">Tue, Sep 15</text>
    <text x="30" y="257" font-size="11" fill="#007aff">⛅ Good</text>
    <rect x="160" y="238" width="180" height="16" rx="4" fill="#e5e5ea"/>
    <rect x="160" y="238" width="159" height="16" rx="4" fill="#007aff"/>
    <text x="348" y="250" font-size="12" text-anchor="end">7.5h</text>

    <!-- Wed, Sep 16 - poor - 5.5h -->
    <text x="30" y="282">Wed, Sep 16</text>
    <text x="30" y="297" font-size="11" fill="#ff3b30">🌧 Poor</text>
    <rect x="160" y="278" width="180" height="16" rx="4" fill="#e5e5ea"/>
    <rect x="160" y="278" width="117" height="16" rx="4" fill="#ff3b30"/>
    <text x="348" y="290" font-size="12" text-anchor="end">5.5h</text>

    <!-- Thu, Sep 17 - great - 8.0h -->
    <text x="30" y="322">Thu, Sep 17</text>
    <text x="30" y="337" font-size="11" fill="#34c759">☀ Great</text>
    <rect x="160" y="318" width="180" height="16" rx="4" fill="#e5e5ea"/>
    <rect x="160" y="318" width="169" height="16" rx="4" fill="#34c759"/>
    <text x="348" y="330" font-size="12" text-anchor="end">8.0h</text>

    <!-- Fri, Sep 18 - good - 7.0h -->
    <text x="30" y="362">Fri, Sep 18</text>
    <text x="30" y="377" font-size="11" fill="#007aff">⛅ Good</text>
    <rect x="160" y="358" width="180" height="16" rx="4" fill="#e5e5ea"/>
    <rect x="160" y="358" width="148" height="16" rx="4" fill="#007aff"/>
    <text x="348" y="370" font-size="12" text-anchor="end">7.0h</text>

    <!-- Sat, Sep 19 - fair - 6.0h -->
    <text x="30" y="402">Sat, Sep 19</text>
    <text x="30" y="417" font-size="11" fill="#ff9500">☁ Fair</text>
    <rect x="160" y="398" width="180" height="16" rx="4" fill="#e5e5ea"/>
    <rect x="160" y="398" width="127" height="16" rx="4" fill="#ff9500"/>
    <text x="348" y="410" font-size="12" text-anchor="end">6.0h</text>

    <!-- Sun, Sep 20 - great - 8.5h -->
    <text x="30" y="442">Sun, Sep 20</text>
    <text x="30" y="457" font-size="11" fill="#34c759">☀ Great</text>
    <rect x="160" y="438" width="180" height="16" rx="4" fill="#e5e5ea"/>
    <rect x="160" y="438" width="180" height="16" rx="4" fill="#34c759"/>
    <text x="348" y="450" font-size="12" text-anchor="end">8.5h</text>
  </g>
  <line x1="30" y1="470" x2="360" y2="470" stroke="#d1d1d6" stroke-width="1"/>

  <!-- home indicator -->
  <rect x="150" y="700" width="90" height="5" rx="2.5" fill="#1c1c1e"/>
</svg>
