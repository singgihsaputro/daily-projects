  <text x="36" y="100" font-family="sans-serif" font-size="11" fill="#1F4E8C">Text or URL</text>
  <text x="36" y="122" font-family="monospace" font-size="14" fill="#1C1B1F">https://example.com</text>

  <!-- preset chips -->
