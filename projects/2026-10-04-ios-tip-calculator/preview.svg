<svg xmlns="http://www.w3.org/2000/svg" width="390" height="780" viewBox="0 0 390 780" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <rect width="390" height="780" fill="#f2f2f7"/>
  <text x="20" y="90" font-size="32" font-weight="700">Tip Calculator</text>
  <text x="32" y="130" font-size="12" fill="#6c6c70">WHERE ARE YOU?</text>
  <rect x="16" y="140" width="358" height="92" rx="12" fill="#fff"/>
  <text x="32" y="172" font-size="16">Country</text>
  <text x="358" y="172" font-size="16" fill="#007aff" text-anchor="end">🇺🇸 United States ⌄</text>
  <text x="32" y="205" font-size="12" fill="#6c6c70">Tipping is expected at restaurants.</text>
  <text x="32" y="262" font-size="12" fill="#6c6c70">BILL</text>
  <rect x="16" y="272" width="358" height="48" rx="12" fill="#fff"/>
  <text x="32" y="302" font-size="16">86.40</text>
  <text x="32" y="350" font-size="12" fill="#6c6c70">TIP: 18%</text>
  <rect x="16" y="360" width="358" height="168" rx="12" fill="#fff"/>
  <rect x="28" y="372" width="334" height="32" rx="8" fill="#eeeef0"/>
  <rect x="140" y="374" width="110" height="28" rx="7" fill="#fff" stroke="#ddd"/>
  <text x="84" y="394" font-size="14" text-anchor="middle">15%</text>
  <text x="195" y="394" font-size="14" text-anchor="middle" font-weight="600">18%</text>
  <text x="306" y="394" font-size="14" text-anchor="middle">20%</text>
  <line x1="32" y1="436" x2="358" y2="436" stroke="#ddd" stroke-width="4" stroke-linecap="round"/>
  <line x1="32" y1="436" x2="223" y2="436" stroke="#007aff" stroke-width="4" stroke-linecap="round"/>
  <circle cx="223" cy="436" r="12" fill="#fff" stroke="#ccc"/>
  <text x="32" y="478" font-size="16">Split between 3</text>
  <text x="300" y="478" font-size="18" fill="#007aff">−    +</text>
  <text x="32" y="512" font-size="16">Round total up</text>
  <rect x="312" y="496" width="50" height="30" rx="15" fill="#e5e5ea"/>
  <circle cx="327" cy="511" r="12" fill="#fff"/>
  <text x="32" y="558" font-size="12" fill="#6c6c70">RESULT</text>
  <rect x="16" y="568" width="358" height="150" rx="12" fill="#fff"/>
  <text x="32" y="604" font-size="16">Tip</text>
  <text x="358" y="604" font-size="16" text-anchor="end">$15.55</text>
  <text x="32" y="646" font-size="16">Total</text>
  <text x="358" y="646" font-size="16" text-anchor="end">$101.95</text>
  <text x="32" y="696" font-size="16">Each person</text>
  <text x="358" y="696" font-size="22" font-weight="700" text-anchor="end">$33.99</text>
  <text x="195" y="765" font-size="11" fill="#8e8e93" text-anchor="middle">UI mockup — hand-drawn, not a screenshot</text>
</svg>
