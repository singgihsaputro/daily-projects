<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Bookmarks</title>
    <style>
        body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #1a1a2e; }
        h1 { margin-bottom: 4px; }
        .hint { color: #666; font-size: 0.85rem; margin-bottom: 20px; }
        form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        form input[name=url] { grid-column: 1 / 3; }
        input { padding: 8px; font-size: 1rem; border: 1px solid #ccc; border-radius: 6px; }
        button { padding: 6px 14px; font-size: 0.95rem; border: none; border-radius: 6px; background: #3f51b5; color: white; cursor: pointer; }
        button:hover { background: #32408f; }
        .error { color: #c62828; min-height: 1.2em; margin: 4px 0 8px; }
        #tag-filter { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
        .chip { background: #e8eaf6; color: #3f51b5; border-radius: 16px; }
        .chip:hover { background: #c5cae9; }
        .chip.active { background: #3f51b5; color: white; }
        ul { list-style: none; padding: 0; }
        li { border-bottom: 1px solid #eee; padding: 12px 0; }
        .title { font-weight: bold; }
        .url { color: #555; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tag { color: #888; font-size: 0.85rem; }
        .actions { margin-top: 6px; display: flex; gap: 8px; }
        .star-btn { background: #f9a825; }
        .star-btn:hover { background: #f57f17; }
        .delete-btn { background: #c62828; }
        .delete-btn:hover { background: #8e0000; }
    </style>
</head>
<body>
    <h1>Bookmarks</h1>
    <p class="hint">Talks to the real Ktor server at <code>http://localhost:8080</code> — start it with <code>./gradlew :server:run</code>.</p>
    <form id="create-form">
        <input type="text" name="title" id="title-input" placeholder="Title" />
        <input type="text" name="tag" id="tag-input" placeholder="Tag (optional)" />
        <input type="text" name="url" id="url-input" placeholder="https://example.com/a/page" />
        <button type="submit">Save bookmark</button>
    </form>
    <div class="error" id="error"></div>
    <div id="tag-filter"></div>
    <ul id="bookmark-list"></ul>
    <script src="bookmarks-web.js"></script>
</body>
</html>
