<svg xmlns="http://www.w3.org/2000/svg" width="900" height="274" font-family="monospace" font-size="13"><rect width="900" height="274" rx="8" fill="#0f172a"/><text x="16" y="24" fill="#94a3b8">packing-list — captured output of a real run (npm start + curl)</text><text x="16" y="50" fill="#7dd3fc" xml:space="preserve">$ curl -s localhost:8080/api/templates</text><text x="16" y="68" fill="#e2e8f0" xml:space="preserve">[{&quot;id&quot;:&quot;beach&quot;,&quot;label&quot;:&quot;Beach holiday&quot;},{&quot;id&quot;:&quot;hiking&quot;,&quot;label&quot;:&quot;Hiking</text><text x="16" y="86" fill="#e2e8f0" xml:space="preserve">  trip&quot;},{&quot;id&quot;:&quot;business&quot;,&quot;label&quot;:&quot;Business trip&quot;}]</text><text x="16" y="104" fill="#7dd3fc" xml:space="preserve">$ curl -s -X POST localhost:8080/api/trips -d {&quot;name&quot;:&quot;Lombok&quot;,&quot;days&quot;:5,&quot;template&quot;:&quot;beach&quot;}</text><text x="16" y="122" fill="#e2e8f0" xml:space="preserve">{&quot;id&quot;:&quot;trip101&quot;,&quot;name&quot;:&quot;Lombok&quot;,&quot;days&quot;:5,&quot;template&quot;:&quot;beach&quot;,&quot;items&quot;:[{&quot;id&quot;:&quot;i102&quot;,&quot;name&quot;:&quot;T-shirt&quot;,&quot; …</text><text x="16" y="140" fill="#7dd3fc" xml:space="preserve">$ curl -s -X PATCH localhost:8080/api/trips/trip1/items/i3 -d {&quot;packed&quot;:true}</text><text x="16" y="158" fill="#e2e8f0" xml:space="preserve">{&quot;id&quot;:&quot;i3&quot;,&quot;name&quot;:&quot;Sunscreen&quot;,&quot;category&quot;:&quot;toiletries&quot;,&quot;qty&quot;:1,&quot;packed&quot;:true}</text><text x="16" y="176" fill="#7dd3fc" xml:space="preserve">$ curl -s localhost:8080/api/trips</text><text x="16" y="194" fill="#e2e8f0" xml:space="preserve">[{&quot;id&quot;:&quot;trip1&quot;,&quot;name&quot;:&quot;Bali long weekend&quot;,&quot;days&quot;:3,&quot;template&quot;:&quot;beach&quot;,&quot;progress&quot;:{&quot;packed&quot;:3,&quot;total&quot;:4,&quot;</text><text x="16" y="212" fill="#e2e8f0" xml:space="preserve">  percent&quot;:75}},{&quot;id&quot;:&quot;trip101&quot;,&quot;name&quot;:&quot;Lombok&quot;,&quot;days&quot;:5,&quot;template&quot;:&quot;beach&quot;,&quot;progress&quot;:{&quot;packed&quot;:0,&quot;tota</text><text x="16" y="230" fill="#e2e8f0" xml:space="preserve">  l&quot;:9,&quot;percent&quot;:0}}]</text><text x="16" y="248" fill="#7dd3fc" xml:space="preserve">$ curl -s -X POST localhost:8080/api/trips -d {&quot;name&quot;:&quot;x&quot;,&quot;days&quot;:0,&quot;template&quot;:&quot;beach&quot;}  # rejected</text><text x="16" y="266" fill="#e2e8f0" xml:space="preserve">{&quot;error&quot;:&quot;\&quot;days\&quot; must be an integer from 1 to 60&quot;} [HTTP 400]</text></svg>